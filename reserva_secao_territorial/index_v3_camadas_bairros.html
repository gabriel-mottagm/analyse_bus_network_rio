<title>Raio-X dos Ônibus do Rio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: aplicativo de tela cheia — cabeçalho com controles, mapa à esquerda, painel lateral (lista ↔ ficha) à direita; no celular, mapa em cima e painel embaixo. */
:root{
  --bg:#f3f1ec; --surface:#fbfaf7; --surface-2:#eeebe4; --ink:#1c1d1a; --ink-2:#55544e; --muted:#85837b;
  --rule:#dcd8ce; --accent:#c98a0c; --accent-ink:#1c1d1a; --focus:#2a78d6;
  --sign-bg:#1d1e1b; --sign-fg:#ffb21a;
  --map-out:#e6e3dc; --map-city:#faf9f6; --map-bairro:#e3dfd5; --map-road1:#d3cec2; --map-road2:#e0dcd2; --map-road3:#e9e6de; --map-rail:#a9a397; --map-label:#7d7a71; --map-halo:#faf9f6;
  --nd:#bdb9af;
  --g1:#184f95; --g2:#3987e5; --g3:#7aaeea; --b1:#ec8a6f; --b2:#e34948; --b3:#a3262a;
  --n1:#d5cff5; --n2:#ada2ec; --n3:#8676df; --n4:#6250d6; --n5:#46379f; --n6:#2c2268;
  --c0:#e5683c; --c1:#9ec5f4; --c2:#5598e7; --c3:#256abf; --c4:#0d366b; --res:#cfcbc1; --pri:#c0392b;
  --d1:#c9d9e8; --d2:#f6c79e; --d3:#e5683c; --d4:#a8401a;
  --v00:#d6d6d6; --v01:#e4acac; --v02:#c85a5a; --v10:#b0d5df; --v11:#ad9ea5; --v12:#985356; --v20:#64acbe; --v21:#627f8c; --v22:#574249;
  --font-ui:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141513; --surface:#1d1e1b; --surface-2:#262723; --ink:#ecebe6; --ink-2:#bdbbb3; --muted:#8e8c84;
  --rule:#34352f; --accent:#f0a920; --accent-ink:#141513; --focus:#6aa6ee;
  --sign-bg:#0b0b0a; --sign-fg:#ffb21a;
  --map-out:#1a1b18; --map-city:#22231f; --map-bairro:#2d2e29; --map-road1:#3d3e38; --map-road2:#33342f; --map-road3:#2c2d29; --map-rail:#55564f; --map-label:#8f8d85; --map-halo:#22231f;
  --nd:#55554f;
  --g1:#8fbcf2; --g2:#5598e7; --g3:#2f6fc4; --b1:#c4473f; --b2:#e8655a; --b3:#f2a091;
  --n1:#3a2f86; --n2:#4f40b0; --n3:#6a59d6; --n4:#8b7de6; --n5:#ab9fef; --n6:#cbc3f6;
  --c0:#e8784f; --c1:#1f3f66; --c2:#2f6fc4; --c3:#5598e7; --c4:#a9cdf6; --res:#3a3b36; --pri:#ef6a5c;
  --d1:#33475c; --d2:#8a5a35; --d3:#d0603a; --d4:#f0a58a;
  --v00:#3b3b39; --v01:#8a4a4a; --v02:#d8605d; --v10:#2d6170; --v11:#7d7279; --v12:#e0907f; --v20:#3fa8c4; --v21:#b0b4bf; --v22:#ffe1d2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141513; --surface:#1d1e1b; --surface-2:#262723; --ink:#ecebe6; --ink-2:#bdbbb3; --muted:#8e8c84;
  --rule:#34352f; --accent:#f0a920; --accent-ink:#141513; --focus:#6aa6ee;
  --sign-bg:#0b0b0a; --sign-fg:#ffb21a;
  --map-out:#1a1b18; --map-city:#22231f; --map-bairro:#2d2e29; --map-road1:#3d3e38; --map-road2:#33342f; --map-road3:#2c2d29; --map-rail:#55564f; --map-label:#8f8d85; --map-halo:#22231f;
  --nd:#55554f;
  --g1:#8fbcf2; --g2:#5598e7; --g3:#2f6fc4; --b1:#c4473f; --b2:#e8655a; --b3:#f2a091;
  --n1:#3a2f86; --n2:#4f40b0; --n3:#6a59d6; --n4:#8b7de6; --n5:#ab9fef; --n6:#cbc3f6;
  --c0:#e8784f; --c1:#1f3f66; --c2:#2f6fc4; --c3:#5598e7; --c4:#a9cdf6; --res:#3a3b36; --pri:#ef6a5c;
  --d1:#33475c; --d2:#8a5a35; --d3:#d0603a; --d4:#f0a58a;
  --v00:#3b3b39; --v01:#8a4a4a; --v02:#d8605d; --v10:#2d6170; --v11:#7d7279; --v12:#e0907f; --v20:#3fa8c4; --v21:#b0b4bf; --v22:#ffe1d2;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Cabeçalho */
header.top{display:flex;flex-direction:column;gap:10px;padding-block:14px 12px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;justify-content:space-between}
.brand h1{font-family:var(--font-disp);font-weight:700;font-size:clamp(24px,3.2vw,32px);letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
.brand h1 .dot{color:var(--accent)}
.brand p{margin:0;color:var(--ink-2);max-width:62ch}
.brand .aboutbtn{background:none;border:1px solid var(--rule);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.brand .aboutbtn:hover{border-color:var(--ink-2);color:var(--ink)}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end}
.ctl{display:flex;flex-direction:column;gap:5px;min-width:0}
.ctl > .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;white-space:nowrap}
.seg button + button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select.sel{border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:6px 10px}
select.sel:disabled{opacity:.45}
.search{position:relative}
.search input{width:min(260px,100%);border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:6px 10px}

/* Área principal */
main.app{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;min-height:0;padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.mapbox{position:relative;border-radius:14px;overflow:hidden;background:var(--map-out);border:1px solid var(--rule);min-height:360px}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#map.dragging{cursor:grabbing}
#map.hovering{cursor:pointer}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:9px;border:1px solid var(--rule);background:var(--surface);cursor:pointer;font-size:18px;line-height:1;display:grid;place-items:center}
.zoom button:hover{border-color:var(--ink-2)}
.legend{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;max-width:min(300px,calc(100% - 20px));backdrop-filter:blur(4px)}
.legend h3{margin:0 0 2px;font-size:13px;font-weight:600}
.lgt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.lgt .car{color:var(--muted);font-size:12px}
.legend.closed ul,.legend.closed .sub,.legend.closed .note{display:none}
.legend.closed h3{margin:0}
.legend .sub{font-size:12px;color:var(--muted);margin-bottom:6px}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.legend li{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;font-size:13px}
.legend .sw{height:4px;border-radius:2px}
.legend .ct{color:var(--muted);font-size:12px}
.legend .note{font-size:12px;color:var(--muted);margin-top:6px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:7px 10px;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.12);max-width:260px;z-index:5}
.tip b{font-family:var(--font-disp);font-size:16px;margin-right:4px}
.tip .v{display:block;color:var(--ink-2)}

/* Letreiro (placa de destino do ônibus) */
.sign{display:inline-flex;align-items:center;gap:10px;background:var(--sign-bg);color:var(--sign-fg);border-radius:6px;padding:4px 10px;font-family:var(--font-disp);font-weight:700;letter-spacing:.03em;min-width:0}
.sign .no{font-size:20px;line-height:1}
.sign .dest{font-size:14px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;line-height:1.2}
.pill{display:inline-block;font-family:var(--font-disp);font-weight:700;font-size:15px;line-height:1;padding:5px 7px;border-radius:5px;background:var(--sign-bg);color:var(--sign-fg);min-width:44px;text-align:center;letter-spacing:.02em}

/* Painel lateral */
aside.panel{background:var(--surface);border:1px solid var(--rule);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.phead{padding:12px 14px 10px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.phead h2{margin:0;font-size:16px;font-weight:600}
.phead .meta{font-size:13px;color:var(--muted)}
.sortbtn{align-self:flex-start;border:1px solid var(--rule);background:none;border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.list{overflow-y:auto;flex:1;min-height:0}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:8px 14px;cursor:pointer}
.row:hover,.row.hl{background:var(--surface-2)}
.row .nm{font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .md{font-size:12px;color:var(--muted)}
.row .val{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.row .val i{width:10px;height:10px;border-radius:50%;display:inline-block}
.empty{padding:24px 14px;color:var(--muted)}
.more{display:block;width:calc(100% - 28px);margin:12px 14px;padding:8px;border:1px solid var(--rule);border-radius:10px;background:none;cursor:pointer;color:var(--ink-2)}
.more:hover{border-color:var(--ink-2);color:var(--ink)}

/* Ficha */
.ficha{overflow-y:auto;flex:1;min-height:0;padding:12px 14px 18px;display:flex;flex-direction:column;gap:16px}
.back{align-self:flex-start;background:none;border:0;padding:0;color:var(--ink-2);cursor:pointer;font-size:14px}
.back:hover{color:var(--ink)}
.fhead{display:flex;flex-direction:column;gap:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;border:1px solid var(--rule);border-radius:999px;padding:2px 9px;color:var(--ink-2)}
.lead{font-size:17px;line-height:1.35;margin:0;text-wrap:pretty}
.lead strong{font-family:var(--font-disp);font-size:24px;font-weight:700}
.sec h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.tw{width:100%;border-collapse:collapse;font-size:13px}
table.tw th,table.tw td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--rule)}
table.tw th:first-child,table.tw td:first-child{text-align:left;color:var(--ink-2);font-weight:400}
table.tw thead th{font-weight:600;color:var(--muted);font-size:12px}
table.tw td.cur{font-weight:700;background:var(--surface-2)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{border:1px solid var(--rule);border-radius:10px;padding:9px 10px}
.fact .k{font-size:12px;color:var(--muted)}
.fact .v{font-family:var(--font-disp);font-size:22px;font-weight:700;line-height:1.1}
.fact .s{font-size:12px;color:var(--ink-2)}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--font-ui)}
.chart .bar{fill:var(--accent)}
.chart .bar.dim{fill:var(--rule)}
.chart .base{stroke:var(--rule)}
.foot{font-size:12px;color:var(--muted)}

/* Abas e bairros */
.tabs{display:flex;border-bottom:1px solid var(--rule)}
.tab{flex:1;padding:10px 8px 9px;border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.bbar{display:flex;height:8px;border-radius:4px;overflow:hidden;width:68px;background:var(--surface-2)}
.bbar i{display:block;height:100%}
.nvbar{display:flex;height:16px;border-radius:5px;overflow:hidden;width:100%}
.nvbar i{display:block;height:100%}
.nvleg{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;margin-top:8px}
.nvleg span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.nvleg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.lns{display:flex;flex-wrap:wrap;gap:6px}
.lns button{border:0;padding:0;background:none;cursor:pointer}
.lns .pill{font-size:14px;min-width:40px}
.metsel{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:3px 8px;font-size:13px;max-width:100%}
.bivleg{display:grid;grid-template-columns:auto repeat(3,36px);gap:2px;align-items:center;font-size:10.5px;color:var(--muted)}
.bivleg i{display:block;height:18px;border-radius:2px}
.bivwrap{display:flex;gap:10px;align-items:flex-end}
.bivnotes{font-size:12px;color:var(--ink-2);display:grid;gap:4px}
.tip .bn{display:block;font-weight:600}

/* Sobre */
.about{overflow-y:auto;flex:1;min-height:0;padding:12px 16px 18px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.about h3{margin:4px 0 0;font-size:15px}
.about p{margin:0;max-width:65ch;color:var(--ink-2)}
.about ul{margin:0;padding-left:18px;color:var(--ink-2);display:grid;gap:4px}

@media (max-width: 900px){
  html,body{height:auto}
  main.app{grid-template-columns:1fr}
  .mapbox{height:clamp(320px,48vh,460px);min-height:0}
  aside.panel{max-height:none}
  .list,.ficha,.about{overflow:visible}
  .legend{max-width:calc(100% - 64px)}
  .search input{width:100%}
  .ctl.grow{flex:1 1 100%}
  .brand p{font-size:14px}
  .brand h1{font-size:24px}
  header.top{gap:8px;padding-block:10px 10px}
  .controls{gap:8px 12px}
  #indChips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  #indChips::-webkit-scrollbar{display:none}
  .chip{padding:5px 11px}
  .seg button{padding:5px 9px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="brand">
    <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
      <h1>Raio-X dos Ônibus do Rio<span class="dot">.</span></h1>
      <p>Veja como cada linha de ônibus, BRT e frescão da cidade funciona: de quanto em quanto tempo passa, quantas viagens faz e quem mora perto.</p>
    </div>
    <button class="aboutbtn" id="aboutBtn" type="button">Sobre os dados</button>
  </div>
  <div class="controls">
    <div class="ctl grow">
      <span class="lbl" id="lblInd">O que você quer ver</span>
      <div class="chips" id="indChips" role="group" aria-labelledby="lblInd"></div>
    </div>
    <div class="ctl">
      <span class="lbl" id="lblDia">Dia</span>
      <div class="seg" id="diaSeg" role="group" aria-labelledby="lblDia"></div>
    </div>
    <div class="ctl">
      <label class="lbl" for="faixaSel">Horário</label>
      <select class="sel" id="faixaSel"></select>
    </div>
    <div class="ctl">
      <span class="lbl" id="lblModo">Tipo</span>
      <div class="seg" id="modoSeg" role="group" aria-labelledby="lblModo"></div>
    </div>
    <div class="ctl">
      <label class="lbl" for="camSel">Camada no mapa</label>
      <select class="sel" id="camSel"></select>
    </div>
    <div class="ctl search grow" style="flex:1 1 200px">
      <label class="lbl" for="busca">Buscar linha</label>
      <input id="busca" type="search" placeholder="Número ou bairro, ex.: 474, Penha" autocomplete="off">
    </div>
  </div>
</header>

<main class="app">
  <div class="mapbox" id="mapbox">
    <canvas id="map" aria-label="Mapa das linhas de ônibus do Rio de Janeiro, coloridas pelo indicador escolhido. A mesma informação está na lista ao lado."></canvas>
    <div class="zoom">
      <button id="zin" type="button" aria-label="Aproximar">+</button>
      <button id="zout" type="button" aria-label="Afastar">−</button>
      <button id="zfit" type="button" aria-label="Ver a cidade inteira" title="Ver a cidade inteira" style="font-size:14px">⤢</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip" hidden></div>
  </div>
  <aside class="panel" id="panel">
    <div class="tabs" role="tablist"><button class="tab" id="tabLinhas" role="tab" type="button">Linhas</button><button class="tab" id="tabBairros" role="tab" type="button">Bairros</button></div>
    <div id="listView" style="display:flex;flex-direction:column;min-height:0;flex:1">
      <div class="phead">
        <h2 id="listTitle">Linhas</h2>
        <div class="meta" id="listMeta"></div>
        <button class="sortbtn" id="sortBtn" type="button"></button>
      </div>
      <div class="list" id="list" role="list"></div>
    </div>
    <div id="fichaView" class="ficha" hidden></div>
    <div id="bListView" style="display:none;flex-direction:column;min-height:0;flex:1">
      <div class="phead"><h2 id="bTitle">Bairros</h2><div class="meta" id="bMeta"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><label class="meta" for="bMet">Ordenar por</label><select class="metsel" id="bMet"></select><button class="sortbtn" id="bSort" type="button"></button></div></div>
      <div class="list" id="bList" role="list"></div>
    </div>
    <div id="bFichaView" class="ficha" hidden></div>
    <div id="aboutView" class="about" hidden></div>
  </aside>
</main>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const fmt=(v,d=0)=>v==null?'—':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- Indicadores ---------- */
const GOOD=['--g1','--g2','--g3','--b1','--b2','--b3'];      // melhor → pior
const NEUT=['--n1','--n2','--n3','--n4','--n5','--n6'];      // menos → mais (sem juízo de valor)
const FX_LABEL=['Madrugada (0h–5h)','Pico da manhã (6h–9h)','Meio do dia (9h–16h)','Pico da tarde (16h–19h)','Noite (19h–24h)','Dia todo'];
const IND=[
 {k:'espera',chip:'Tempo de espera',titulo:'Tempo de espera no ponto',unid:'min',usaFaixa:true,
  desc:'De quanto em quanto tempo passa um ônibus da linha, em média, em cada sentido.',
  get:(l,d,f)=>l.iv[d][f], cuts:[5,10,15,20,30], dir:'asc', pal:GOOD,
  labels:['até 5 min','5 a 10 min','10 a 15 min','15 a 20 min','20 a 30 min','mais de 30 min'],
  show:v=>`passa a cada ${fmt(v, v<10?1:0)} min`, short:v=>`${fmt(v, v<10?1:0)} min`, nd:'não passa nesse horário'},
 {k:'viagens',chip:'Ônibus por dia',titulo:'Ônibus por dia',unid:'',usaFaixa:false,

/* classe 0..5 na ordem das legendas (do "melhor"/menor para o "pior"/maior) */
function classe(ind,v){
  if(v==null) return -1;
  const c=ind.cuts; let i=0; while(i<c.length && v>=c[i]) i++;   // i: 0 (menor) .. 5 (maior)
  if(ind.neutral) return i;
  return ind.dir==='asc'? i : 5-i;     // asc: menor é melhor; desc: maior é melhor
}
function palColor(ind,cls){
  if(cls<0) return cssv('--nd');
  return cssv(ind.pal[cls]);
}

/* ---------- Dados derivados ---------- */
function val(l){return IND[S.ind].get(l,S.dia,S.faixa)}
function inModo(l){return S.modo==='Todas'||l.modo===S.modo}
function matches(l){if(!S.busca) return true; return norm(l.n).startsWith(S.busca)||norm(l.nome).includes(S.busca)}
function visibleSorted(){
  const ind=IND[S.ind];
  const arr=D.linhas.filter(l=>inModo(l)&&matches(l));
  const better=ind.neutral? -1 : (ind.dir==='asc'?1:-1);   // multiplicador p/ "melhores primeiro"
  arr.sort((a,b)=>{const va=val(a),vb=val(b); if(va==null&&vb==null) return a.n.localeCompare(b.n,'pt',{numeric:true}); if(va==null) return 1; if(vb==null) return -1;
    const s=(va-vb)*(ind.neutral? -1:(ind.dir==='asc'?1:-1)); return S.sortGood? s : -s});
  return arr;
}

}

function barChart(h){
  const W=360,H=120,pl=26,pb=18,pt=8,mx=Math.max(1,...h),bw=(W-pl)/24;
  const nice=mx<=4?mx:Math.ceil(mx/ (mx>40?10:5))*(mx>40?10:5);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Partidas por hora ao longo do dia">`;
  [0,nice/2,nice].forEach(t=>{const y=H-pb-(H-pb-pt)*t/nice; s+=`<line class="base" x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke-width="${t===0?1:0.5}"/><text class="ax" x="${pl-4}" y="${y+3}" text-anchor="end">${fmt(t)}</text>`});
  h.forEach((v,i)=>{const bh=(H-pb-pt)*v/nice; if(v>0) s+=`<rect class="bar" x="${pl+i*bw+1}" y="${H-pb-bh}" width="${bw-2}" height="${bh}" rx="1.5"><title>${String(i).padStart(2,'0')}h: ${v} partida${v===1?'':'s'}</title></rect>`});
  [0,6,12,18,23].forEach(i=>{s+=`<text class="ax" x="${pl+i*bw+bw/2}" y="${H-4}" text-anchor="middle">${i}h</text>`});
  return s+'</svg>';
}

    h+=`<div class="sub">Ônibus por hora a até 400 m a pé (pico) × renda da vizinhança</div><div class="bivwrap">${g}<div class="bivnotes"><span>Canto superior esquerdo: baixa renda e poucos ônibus.</span><span>Ônibus: poucos = sem parada ou menos de 10/h; muitos = 30 ou mais/h.</span></div></div>`;
  } else if(S.cam===3){
    h+=`<div class="sub">Pico da manhã, dia útil</div><ul><li><span class="sw" style="background:${cssv('--pri')};height:10px"></span><span>30% de renda mais baixa sem parada a 5 min a pé ou com menos de 10 ônibus/h</span><span class="ct num">${fmt(L.pri/1e6,2)} mi</span></li><li><span class="sw" style="background:${cssv('--res')};height:10px"></span><span>Demais moradores</span><span></span></li></ul><div class="note">Vermelho mais forte: mais gente nessa situação.</div>`;
  }
  h+=`<div class="note">Linhas de ônibus em cinza. Escolha "Nenhuma" para colorir as linhas.</div>`;
  lg.innerHTML=h;
  $('#lgToggle').addEventListener('click',()=>{S.legOpen=!S.legOpen; renderLegend(); if(!userView&&S.sel==null&&S.bsel==null){fitBox(CITYB);draw()}});
}

/* ---------- Bairros ---------- */
const pc=v=>v==null?'—':fmt(v,0)+'%';
const BMET=[
 {nome:'Parada a até 5 min a pé',get:b=>b.p4,show:b=>`${pc(b.p4)} dos moradores têm parada a até 5 min a pé`,short:b=>pc(b.p4),desc:false},
 {nome:'10 ou mais ônibus/h perto',get:b=>b.bom,show:b=>`${pc(b.bom)} têm 10 ou mais ônibus/h a até 5 min a pé no pico`,short:b=>pc(b.bom),desc:false},
 {nome:'Caminhada até o ponto',get:b=>b.dist,show:b=>`caminhada média de ${fmt(b.dist)} m até o ponto`,short:b=>`${fmt(b.dist)} m`,desc:true},
 {nome:'Pessoas onde falta ônibus',get:b=>b.pri,show:b=>`${fmt(b.pri)} moradores onde falta ônibus (${pc(b.ppri)})`,short:b=>b.pri>=1000?`${fmt(b.pri/1000)} mil`:fmt(b.pri),desc:true},
 {nome:'População',get:b=>b.pop,show:b=>`${fmt(b.pop)} moradores`,short:b=>b.pop>=1000?`${fmt(b.pop/1000)} mil`:fmt(b.pop),desc:true},
];
function setTab(t){
  if(S.tab===t) return; S.tab=t; S.hover=null; S.bhover=null; tip.hidden=true;
  if(t==='bairros'){ if(!S.cam){S.cam=1;S.camAuto=true} showView(S.bsel!=null?'bficha':'blist'); }
  else { if(S.camAuto){S.cam=0;S.camAuto=false} showView(S.sel!=null?'ficha':'list'); }
  update();
}
function bSorted(){
  const m=BMET[S.bmet];
  const arr=TER.bairros.map((b,i)=>i).filter(i=>!S.busca||norm(TER.bairros[i].n).includes(S.busca));
  arr.sort((a,b)=>{const va=m.get(TER.bairros[a]),vb=m.get(TER.bairros[b]); if(va==null) return 1; if(vb==null) return -1; return S.bdesc?vb-va:va-vb});
  return arr;
}
function nvBar(nv,cls='bbar'){const tok=CAMS[1].tok; return `<span class="${cls}">${nv.map((v,i)=>v>0?`<i style="width:${v}%;background:${cssv(tok[i])}"></i>`:'').join('')}</span>`}
function renderBList(){
  if(!TER) return; const m=BMET[S.bmet], arr=bSorted();
  $('#bTitle').textContent='Bairros';
  $('#bMeta').textContent=`${arr.length} bairro${arr.length===1?'':'s'}${S.busca?' encontrados':''} · barra: ônibus perto de casa, do vermelho (sem parada) ao azul-escuro`;
  $('#bSort').textContent=S.bdesc?'Maiores primeiro':'Menores primeiro';
  const frag=document.createDocumentFragment();
  arr.forEach(i=>{const b=TER.bairros[i]; const r=document.createElement('button'); r.type='button'; r.className='row'; r.setAttribute('role','listitem');
    r.innerHTML=`${nvBar(b.nv)}<span style="min-width:0"><span class="nm">${esc(b.n)}</span><span class="md">${esc(b.ra)} · ${esc(b.ap)} · ${fmt(b.pop)} hab.</span></span><span class="val num">${m.short(b)}</span>`;
    r.addEventListener('click',()=>selectB(i,true)); r.addEventListener('mouseenter',()=>{S.bhover=i;draw()}); r.addEventListener('mouseleave',()=>{S.bhover=null;draw()});
    frag.appendChild(r)});
  const L=$('#bList'); L.innerHTML=''; if(arr.length) L.appendChild(frag); else L.innerHTML='<div class="empty">Nenhum bairro com esse nome.</div>';
}
function selectB(i,fit){
  if(S.tab!=='bairros'){S.tab='bairros'; if(!S.cam) S.cam=1; syncControls(); renderLegend()}
  S.bsel=i; renderBFicha(i); showView('bficha'); const b=TER.bairros[i];
  if(fit&&b.bb){userView=true; fitBox(b.bb,0.12)} draw();
  if(window.matchMedia('(max-width:900px)').matches) $('#mapbox').scrollIntoView({behavior:'smooth',block:'start'});
}
function deselectB(){S.bsel=null; showView('blist'); draw()}
function renderBFicha(i){
  const b=TER.bairros[i], C_=TER.cidade, tok=CAMS[1].tok;
  let lead;
  if(!b.pop) lead='Bairro sem moradores no Censo 2022.';
  else lead=`<strong class="num">${pc(b.p4)}</strong> dos moradores têm uma parada de ônibus a até 5 minutos a pé. Na cidade, são ${pc(C_.p4)}.`;
  const nota=b.n==='Gericinó'?'<p class="foot">A população recenseada em Gericinó está quase toda no complexo penitenciário.</p>':(b.n==='Paquetá'?'<p class="foot">Paquetá não tem linhas de ônibus; o acesso é por barca.</p>':'');
  const ls=b.ln.map(id=>D.linhas[id]);
  $('#bFichaView').innerHTML=`
   <button class="back" id="bBack" type="button">← Todos os bairros</button>
   <div class="fhead">
     <h2 style="margin:0;font-family:var(--font-disp);font-size:28px;line-height:1.05">${esc(b.n)}</h2>
     <div class="tags"><span class="tag">${esc(b.ra)}</span><span class="tag">${esc(b.ap)}</span><span class="tag num">${fmt(b.pop)} moradores</span>${b.dens?`<span class="tag num">${fmt(b.dens)} hab/km²</span>`:''}</div>
     <p class="lead">${lead}</p>${nota}
   </div>
   <div class="sec"><h4>Ônibus perto de casa · pico da manhã</h4>${nvBar(b.nv,'nvbar')}
     <div class="nvleg">${CAMS[1].labels.map((t,k)=>`<span><b style="background:${cssv(tok[k])}"></b>${t}</span><span>${fmt(b.nv[k],0)}%</span>`).join('')}</div></div>
   <div class="facts">
     <div class="fact"><div class="k">Caminhada até o ponto</div><div class="v num">${fmt(b.dist)} m</div><div class="s">média do bairro · cidade: ${fmt(C_.dist)} m</div></div>
     <div class="fact"><div class="k">10 ou mais ônibus/h perto</div><div class="v num">${pc(b.bom)}</div><div class="s">dos moradores · cidade: ${pc(C_.bom)}</div></div>
     <div class="fact"><div class="k">Onde falta ônibus</div><div class="v num">${b.pri>=1000?fmt(b.pri/1000)+' mil':fmt(b.pri)}</div><div class="s">${pc(b.ppri)} do bairro: baixa renda e pouco ônibus</div></div>
     <div class="fact"><div class="k">Parada a até 10 min a pé</div><div class="v num">${pc(b.p8)}</div><div class="s">800 m de caminhada</div></div>
     <div class="fact"><div class="k">Renda média do responsável</div><div class="v num">${b.renda?'R$ '+fmt(b.renda):'—'}</div><div class="s">Censo 2022</div></div>
     <div class="fact"><div class="k">Desvio da caminhada</div><div class="v num">${b.desv?fmt(b.desv,1)+'×':'—'}</div><div class="s">a pé ÷ linha reta</div></div>
   </div>
   <div class="sec"><h4>Linhas que param no bairro · ${ls.length}</h4>${ls.length?`<div class="lns">${ls.map(l=>`<button type="button" data-id="${l.id}" title="${esc(l.nome)}"><span class="pill">${esc(l.n)}</span></button>`).join('')}</div><div class="foot" style="margin-top:6px">Das que mais rodam para as que menos rodam em dia útil. Toque para ver a linha.</div>`:'<p class="foot">Nenhuma linha de ônibus para neste bairro.</p>'}</div>`;
  $('#bBack').addEventListener('click',deselectB);
  $('#bFichaView').querySelectorAll('.lns button').forEach(x=>x.addEventListener('click',()=>{S.cam=0; select(+x.dataset.id,true); update()}));
}

/* ---------- Ciclo ---------- */
function update(){
  S.lim=40; syncControls(); buildBins(); renderLegend(); renderList(); renderBList();
  if(S.bsel!=null&&S.view==='bficha') renderBFicha(S.bsel);
  if(S.sel!=null&&S.view==='ficha') renderFicha(D.linhas[S.sel]);
  draw(); save();
}
function init(){
  buildControls(); renderAbout(); readColors(); prepMap();
  new ResizeObserver(()=>{resize(); if(!userView&&S.sel==null){fitBox(CITYB); draw()}}).observe($('#mapbox'));
  const mq=window.matchMedia('(prefers-color-scheme: dark)'); const re=()=>{readColors(); layerCache={}; renderLegend(); renderList(); renderBList(); if(S.bsel!=null&&S.view==='bficha') renderBFicha(S.bsel); draw()};
  mq.addEventListener?.('change',re); new MutationObserver(re).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  document.fonts?.ready.then(()=>draw());
  showView('list'); update();
}
})();
</script>
